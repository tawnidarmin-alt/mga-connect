<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MGA Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-notified { color: green; font-weight: bold; }
        .status-cancelled { color: red; font-weight: bold; }
        .table-container { overflow-x: auto; white-space: nowrap; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid mt-4">
        <h2>MGA Staff Dashboard - Passenger List</h2>
        <div class="table-container shadow-sm bg-white p-3 rounded">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Booking ID</th>
                        <th>Name</th>
                        <th>Flight #</th>
                        <th>Date/Time</th>
                        <th>Status</th>
                        <th>Action Button</th>
                        <th>Staff Note</th>
                        <th>Service Type</th>
                        <th>Contact</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadBookings() {
            const response = await fetch('http://localhost:5001/bookings');
            const bookings = await response.json();
            const tableBody = document.getElementById('bookingTableBody');
            
            tableBody.innerHTML = bookings.map(b => `
                <tr>
                    <td>${b.bookingCode || 'N/A'}</td>
                    <td><strong>${b.name}</strong></td>
                    <td>${b.flightNumber}</td>
                    <td>${b.flightDate} ${b.flightTime}</td>
                    <td id="status-${b.bookingCode}" class="${b.status === 'Notified' ? 'status-notified' : ''}">
                        ${b.status || 'Pending'}
                    </td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="notifyClient('${b.bookingCode}')">
                            Notify Client
                        </button>
                    </td>
                    <td><input type="text" class="form-control form-control-sm" placeholder="Add note..."></td>
                    <td>${b.serviceType}</td>
                    <td>${b.contactNumber}</td>
                </tr>
            `).join('');
        }

        async function notifyClient(code) {
            const res = await fetch(`http://localhost:5001/bookings/notify/${code}`, { method: 'POST' });
            if (res.ok) {
                document.getElementById(`status-${code}`).innerText = 'Notified';
                document.getElementById(`status-${code}`).classList.add('status-notified');
                alert("Email sent and Status Updated!");
            }
        }

        loadBookings();
    </script>
</body>
</html>
