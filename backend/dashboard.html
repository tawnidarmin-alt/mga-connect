<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MGA Connect - Staff Dashboard</title>
    <style>
        :root {
            --primary: #003366;
            --danger: #d9534f;
            --success: #5cb85c;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .status-bar {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            background: #e6fffa;
            color: #2c7a7b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            background-color: var(--primary);
        }

        .badge-cancelled {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 4px 8px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✈️ MGA Connect Booking Dashboard</h1>
        <div id="connection-status" class="status-bar">Connecting to Database...</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client Name</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="booking-table-body"></tbody>
        </table>
    </div>
  <script> async function loadBookings() { try { const response = await fetch('/bookings'); const bookings = await response.json(); const tableBody = document.getElementById('booking-table-body'); document.getElementById('connection-status').innerText = "✅ Connected to Live Database"; tableBody.innerHTML = '';

</script>

</body>

</html>
